# Fly.io config for the Litter-Robot watcher (always-on worker, no public ports)
app = "litter-robot-watcher"
primary_region = "iad"

[build]

[env]
  SLOW_POLL_SECONDS = "5"
  FAST_POLL_SECONDS = "1"
  MAX_FAST_SECONDS = "600"
  WEIGHT_THRESHOLD_LB = "3.0"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
